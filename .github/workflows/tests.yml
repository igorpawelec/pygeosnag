name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # pygeoadaptels and pygeopalette are not on PyPI, so they come from
        # their repositories first; pip then sees the two dependencies of
        # pyproject as satisfied. Everything else ships wheels for all three
        # platforms. python -m pip, so the install lands in the interpreter
        # that runs the tests.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/igorpawelec/pygeoadaptels.git" "git+https://github.com/igorpawelec/pygeopalette.git"
          python -m pip install -e ".[all]"
          python -m pip install pytest pyflakes

      - name: Verify the package imports
        run: python -c "import pygeosnag; print(pygeosnag.__name__, pygeosnag.__version__, pygeosnag.__file__)"

      - name: Lint
        run: python -m pyflakes pygeosnag/ tests/

      - name: Test
        # No models are downloaded: every test fits its own small forest on a
        # synthetic window or needs none.
        run: python -m pytest -v
